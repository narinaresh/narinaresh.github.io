<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GATE 2025 Technical Study Tracker</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #121212;
    color: #e0e0e0;
    margin: 0;
    padding: 0;
  }
  header {
    background-color: #1f1f1f;
    padding: 1rem;
    text-align: center;
    font-size: 1.5rem;
    font-weight: bold;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
  }
  th, td {
    border: 1px solid #333;
    padding: 0.75rem;
    text-align: left;
  }
  th {
    background-color: #222;
  }
  tr:nth-child(even) {
    background-color: #1a1a1a;
  }
  a {
    color: #4dabf7;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
  .checkbox {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>
<header>GATE 2025 Technical Study Tracker</header>
<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Topic</th>
      <th>Resources</th>
      <th>Done</th>
    </tr>
  </thead>
  <tbody id="study-table"></tbody>
</table>
<script>
  const plan = [];
  const start = new Date("2025-08-08");
  const topics = [
    "Machine instructions, addressing modes",
    "ALU, datapath, control unit",
    "Instruction pipelining, hazards",
    "Memory hierarchy: cache, main, secondary",
    "I/O interface: interrupt, DMA",
    "Programming in C: basics, loops",
    "Recursion basics",
    "Arrays, strings",
    "Stacks, queues",
    "Linked lists",
    "Trees, BST",
    "Binary heaps",
    "Graphs: representation",
    "Searching algorithms",
    "Sorting algorithms",
    "Hashing",
    "Time & space complexity",
    "Greedy algorithms",
    "Dynamic programming",
    "Divide and conquer",
    "Graph traversals",
    "Minimum spanning trees",
    "Shortest paths",
    "Regular expressions, finite automata",
    "Context-free grammars",
    "Push-down automata",
    "Pumping lemma",
    "Turing machines",
    "Undecidability",
    "Lexical analysis",
    "Parsing",
    "Syntax-directed translation",
    "Runtime environments",
    "Intermediate code generation",
    "Local optimisation",
    "Data flow analysis",
    "System calls, processes",
    "Threads, IPC",
    "Concurrency, synchronization",
    "Deadlock",
    "CPU scheduling",
    "I/O scheduling",
    "Memory management",
    "Virtual memory",
    "File systems",
    "ER model",
    "Relational algebra",
    "Tuple calculus",
    "SQL",
    "Integrity constraints",
    "Normal forms",
    "File organisation",
    "Indexing (B, B+ trees)",
    "Transactions",
    "Concurrency control",
    "OSI model, TCP/IP",
    "Packet, circuit, virtual circuit switching",
    "Data link layer",
    "Framing, error detection",
    "MAC, Ethernet bridging",
    "Routing protocols",
    "Fragmentation, IP addressing",
    "CIDR notation",
    "ARP, DHCP, ICMP",
    "NAT",
    "Flow & congestion control",
    "UDP, TCP",
    "Sockets",
    "DNS, SMTP, HTTP, FTP",
    "Email protocols",
    "Revision 1",
    "Revision 2",
    "Mock Test 1",
    "Mock Test 2",
    "Revision 3",
    "Full Syllabus Revision",
    "Final Mock Test"
  ];

  let dayIndex = 0;
  for (let i = 0; dayIndex < topics.length; i++) {
    const date = new Date(start);
    date.setDate(start.getDate() + i);
    plan.push({
      date: date.toISOString().split('T')[0],
      topic: topics[dayIndex],
      links: [
        { name: 'NPTEL', url: 'https://nptel.ac.in' },
        { name: 'Gate Smashers', url: 'https://www.youtube.com/@GateSmashers' },
        { name: 'GateOverflow', url: 'https://gateoverflow.in/' },
        { name: 'GFG', url: 'https://www.geeksforgeeks.org' }
      ]
    });
    dayIndex++;
  }

  const tbody = document.getElementById('study-table');
  plan.forEach(entry => {
    const tr = document.createElement('tr');
    const tdDate = document.createElement('td');
    tdDate.textContent = entry.date;
    const tdTopic = document.createElement('td');
    tdTopic.textContent = entry.topic;
    const tdLinks = document.createElement('td');
    entry.links.forEach((link, i) => {
      const a = document.createElement('a');
      a.href = link.url;
      a.textContent = link.name;
      a.target = '_blank';
      tdLinks.appendChild(a);
      if (i < entry.links.length - 1) tdLinks.appendChild(document.createElement('br'));
    });
    const tdCheck = document.createElement('td');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.classList.add('checkbox');
    tdCheck.appendChild(checkbox);
    tr.appendChild(tdDate);
    tr.appendChild(tdTopic);
    tr.appendChild(tdLinks);
    tr.appendChild(tdCheck);
    tbody.appendChild(tr);
  });
  tdDate.textContent = date.toLocaleString('en-US', { month: 'short', day: 'numeric' });
</script>
</body>
</html>
